name: Sync fusedmusic.org feed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fusedmusic.org feed and rebuild data/sessions-feed.json
        run: python3 scripts/sync_fusedmusic_feed.py

      - name: Commit updated feed data (only if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sessions-feed.json
          if git diff --cached --quiet; then
            echo "No changes to the feed — nothing to commit."
          else
            git commit -m "Auto-update sessions feed from fusedmusic.org"
            git push
          fi
